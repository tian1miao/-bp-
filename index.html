<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>王者荣耀 BP 助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1>王者荣耀 BP 助手</h1>
      <p>自由选择双方各分路英雄，随时获取推荐与阵容分析</p>
    </header>

    <div class="card" id="setup-card">
      <div class="setup-grid">
        <div class="form-row">
          <label for="pos-select">位置 / 推荐分路</label>
          <select id="pos-select">
            <option value="">请选择</option>
            <option>对抗路</option>
            <option>中路</option>
            <option>发育路</option>
            <option>打野</option>
            <option>辅助</option>
          </select>
        </div>
      </div>
    </div>

    <main id="bp-area">
      <div class="draft-board">
        <section class="card team-panel mine" id="my-panel">
          <div class="team-heading">
            <div class="team-title">
              <span class="team-dot"></span>
              <h2>我方阵容</h2>
            </div>
            <span class="team-count" id="my-count">0 / 5</span>
          </div>
          <div class="team-slots" id="my-team-slots"></div>
        </section>

        <section class="card team-panel enemy" id="enemy-panel">
          <div class="team-heading">
            <div class="team-title">
              <span class="team-dot"></span>
              <h2>敌方阵容</h2>
            </div>
            <span class="team-count" id="enemy-count">0 / 5</span>
          </div>
          <div class="team-slots" id="enemy-team-slots"></div>
        </section>
      </div>

      <div class="card action-card">
        <div class="status" id="status-text" aria-live="polite">正在加载英雄数据...</div>
        <div class="live-winrate" id="live-winrate" aria-live="polite">
          <div class="live-winrate-copy">
            <span class="live-winrate-label">当前阵容胜率</span>
            <small id="live-winrate-note">双方至少各选一名英雄后计算</small>
          </div>
          <strong class="live-winrate-value" id="live-winrate-value">--</strong>
        </div>
        <div class="live-matchups" id="live-matchups" hidden>
          <div class="live-matchups-heading">
            <span id="live-hero-label">我的分路英雄关系</span>
            <small>克制与协同使用当前胜率模型的同一个指数</small>
          </div>
          <div class="live-matchup-list" id="live-matchup-list"></div>
        </div>
        <div class="hint">每个分路都可以展开下拉框选择，也可以直接输入英雄名；“推荐下一手”只计算你在上方指定的位置。</div>
        <div class="action-grid">
          <button id="recommend-btn" class="btn primary" type="button" disabled>推荐下一手</button>
          <button id="analyze-btn" class="btn success" type="button" disabled>分析完整阵容</button>
          <button id="reset-btn" class="btn secondary" type="button">清空阵容</button>
        </div>
      </div>

      <div class="card" id="rec-card" hidden>
        <div class="section-heading">
          <h3>推荐英雄</h3>
          <span id="rec-subtitle">按指定位置展示</span>
        </div>
        <div id="rec-content"></div>
      </div>

      <div class="card" id="log-card">
        <h3>日志 / 分析</h3>
        <pre id="log-output"></pre>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
