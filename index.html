<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>王者荣耀 BP 助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1>王者荣耀 BP 助手</h1>
      <p>自由选择双方各分路英雄，随时获取推荐与阵容分析</p>
    </header>

    <div class="card" id="setup-card">
      <div class="setup-grid">
        <div class="form-row">
          <label for="side-select">我方阵营</label>
          <select id="side-select">
            <option value="blue">蓝方</option>
            <option value="red">红方</option>
          </select>
        </div>
        <div class="form-row">
          <label for="pos-select">我的位置</label>
          <select id="pos-select">
            <option value="">请选择</option>
            <option>对抗路</option>
            <option>中路</option>
            <option>发育路</option>
            <option>打野</option>
            <option>辅助</option>
          </select>
        </div>
      </div>
    </div>

    <main id="bp-area">
      <div class="draft-board">
        <section class="card team-panel mine" id="my-panel">
          <div class="team-heading">
            <div class="team-title">
              <span class="team-dot"></span>
              <h2>我方阵容</h2>
              <span class="side-label" id="my-side-label">蓝方</span>
            </div>
            <span class="team-count" id="my-count">0 / 5</span>
          </div>
          <div class="team-slots" id="my-team-slots"></div>
        </section>

        <section class="card team-panel enemy" id="enemy-panel">
          <div class="team-heading">
            <div class="team-title">
              <span class="team-dot"></span>
              <h2>敌方阵容</h2>
              <span class="side-label" id="enemy-side-label">红方</span>
            </div>
            <span class="team-count" id="enemy-count">0 / 5</span>
          </div>
          <div class="team-slots" id="enemy-team-slots"></div>
        </section>
      </div>

      <div class="card action-card">
        <div class="status" id="status-text" aria-live="polite">正在加载英雄数据...</div>
        <div class="hint">每个分路都可以展开下拉框选择，也可以直接输入英雄名；同一英雄不能被重复选择。</div>
        <div class="action-grid">
          <button id="recommend-btn" class="btn primary" type="button" disabled>推荐下一手</button>
          <button id="analyze-btn" class="btn success" type="button" disabled>分析完整阵容</button>
          <button id="reset-btn" class="btn secondary" type="button">清空阵容</button>
        </div>
      </div>

      <div class="card" id="rec-card" hidden>
        <div class="section-heading">
          <h3>推荐英雄</h3>
          <span>按我方空缺分路展示</span>
        </div>
        <div id="rec-content"></div>
      </div>

      <div class="card" id="log-card">
        <h3>日志 / 分析</h3>
        <pre id="log-output"></pre>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
